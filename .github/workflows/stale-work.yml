name: stale-work
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  pull-requests: write
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Labels only. Never closes anything.
      - uses: actions/stale@v9
        with:
          days-before-stale: 7
          days-before-close: -1
          stale-pr-label: stale
          stale-issue-label: stale
          stale-pr-message: "No activity for 7 days. Merge, rebase, or close it on purpose."
          days-before-issue-stale: -1
