name: governance
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
jobs:
  branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Branch grammar and merge direction
        env:
          SOLO_MODE: ${{ vars.SOLO_MODE || '1' }}
        run: node scripts/check-branch-governance.mjs "$GITHUB_HEAD_REF" "$GITHUB_BASE_REF"
